name: Deploy Docs

on:
  push:
    branches: [feature/v2]

# Allow this workflow to push back to the repo (for docs/)
permissions:
  contents: write

jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build:docs

      - name: Commit docs/ to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update docs [skip ci]"
          git push
